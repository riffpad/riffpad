# Riffpad relay vhost（放到 sites-available 并软链到 sites-enabled）
#
# 注意：`limit_req_zone` 只能出现在 http 上下文，而 sites-enabled/* 正是被
# nginx.conf 的 http{} 包含的，所以本文件顶层的 zone 定义同样有效，无需额外文件。
#
# 两条与安全直接相关的规则（见 #349）：
#   1. /ws 的 URL query 里带着长寿命凭据（daemon 的 hostSecret 永不过期、
#      浏览器的 30 天 token），所以这个 location 必须 access_log off，
#      否则凭据会落进 access.log、logrotate 归档、日志收集和备份里。
#   2. 限速一律按 $binary_remote_addr，绝不按任何请求头；relay 自身也不再信任
#      X-Forwarded-For（见 apps/relay/internal/hub/util.go）。
#      下面的 burst+nodelay 是给正常用户留的余量：超出的请求被拒绝而不是排队，
#      避免 WebSocket 握手/页面加载被拖慢。

limit_req_zone $binary_remote_addr zone=riffpad_auth:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=riffpad_api:10m rate=20r/s;

server {
    listen 80;
    server_name api.riffpad.ai;

    # WebSocket 端点：请求行里有凭据，绝不写日志。
    location /ws {
        access_log off;

        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 登录 / 注册 / OAuth：更严（正常用户每分钟只需要几次）。
    location /api/auth/ {
        limit_req zone=riffpad_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余 API：宽松，单实例兜住突发，正常使用无感。
    location /api/ {
        limit_req zone=riffpad_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
