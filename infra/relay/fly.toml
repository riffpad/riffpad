app = "riffpad-relay"
primary_region = "hkg"

[build]
  dockerfile = "infra/relay/Dockerfile"

[env]
  RELAY_PORT = "9090"
  RELAY_DATA_DIR = "/data"
  # 可选：设了就用 Postgres，否则用 /data 卷上的 SQLite
  # DATABASE_URL = "postgres://..."

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
