app = "riffpad-relay"
primary_region = "hkg"

[build]
  dockerfile = "infra/relay/Dockerfile"

[env]
  RELAY_PORT = "9090"
  REGISTRATION_KEY = "change-me-to-a-long-random-key"
  RELAY_DATA_DIR = "/data"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
