name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck client-beta
        run: pnpm --filter client-beta typecheck

      - name: Unit test client-beta
        run: pnpm --filter client-beta test

      - name: Build client-beta
        run: pnpm --filter client-beta build

      - name: Lint landing
        run: pnpm --filter landing lint

      - name: Build landing
        run: pnpm --filter landing build

  go:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      # Production runs Postgres; these tests run SQLite by default, so the
      # relay suite is re-run against Postgres below to catch dialect drift.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: riffpad
          POSTGRES_PASSWORD: riffpad
          POSTGRES_DB: riffpad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/daemon/go.sum
            apps/relay/go.sum
            packages/protocol/go.sum

      - name: Test daemon
        working-directory: apps/daemon
        run: go test -race ./...

      - name: Test relay
        working-directory: apps/relay
        run: go test -race ./...

      # The same suite, against the database production actually uses. Without
      # this every store test passes on a dialect nobody deploys.
      - name: Test relay (Postgres)
        working-directory: apps/relay
        env:
          RIFFPAD_TEST_DATABASE_URL: postgres://riffpad:riffpad@127.0.0.1:5432/riffpad_test?sslmode=disable
        run: go test -race ./...

      - name: Test protocol
        working-directory: packages/protocol
        run: go test -race ./...

      - name: Cross-compile guard (windows/darwin)
        working-directory: apps/daemon
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...

  e2e:
    name: Web UI smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client-beta (embedded into daemon)
        run: pnpm --filter client-beta build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/daemon/go.sum

      - name: Build daemon
        working-directory: apps/daemon
        run: go build -o bin/riffpad ./cmd/riffpad

      - name: Build relay
        working-directory: apps/relay
        run: go build -o bin/relay .

      - name: Install Playwright browsers
        working-directory: apps/client-beta
        run: pnpm exec playwright install --with-deps chromium

      - name: Core-path smoke (login → pair → run → approve, through the relay)
        run: node scripts/e2e-core-smoke.mjs

      - name: Run UI smoke tests
        working-directory: apps/client-beta
        env:
          RIFFPAD_DAEMON: ${{ github.workspace }}/apps/daemon/bin/riffpad
        run: pnpm test:e2e

      # The real user path in a real browser: CLI device login, web login,
      # pairing, watching a session and approving from the UI (#314).
      - name: Core-path browser test
        working-directory: apps/client-beta
        run: pnpm test:e2e:core

  deploy:
    name: Deploy relay (CD)
    needs: [frontend, go, e2e]
    # Serialise deploys: two pushes landing close together otherwise race over
    # the same compose container name (#327). Queued runs wait rather than
    # cancel, because cancelling mid `compose up` is likelier to leave
    # production half-updated than the race itself. Deliberately not
    # workflow-level, which would serialise unrelated PR runs too.
    concurrency:
      group: deploy-relay
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 23.254.185.39
          username: riffpad-deploy
          key: ${{ secrets.RACKNERD_DEPLOY_KEY }}
          port: 22
          fingerprint: SHA256:sKA7eS15o6rHn7pkbzARJbdCVgO9dYRAa/hS6C2GV2k
          script: /usr/local/bin/riffpad-deploy.sh
