name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build web client (embedded into binaries)
        run: pnpm --filter client-beta build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/daemon/go.sum

      - name: Cross-compile riffpad
        working-directory: apps/daemon
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64" "windows arm64"; do
            set -- $target
            os=$1
            arch=$2
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-s -w -X github.com/riffpad/riffpad/apps/daemon/internal/version.Version=$VERSION" \
              -o "dist/riffpad-$os-$arch$ext" ./cmd/riffpad
          done
          # Fail the release if the baked-in version does not match the tag.
          ./dist/riffpad-linux-amd64 version | grep -q "$VERSION" || {
            echo "error: binary reports an unexpected version (expected $VERSION)"
            exit 1
          }
          (cd dist && sha256sum riffpad-* > sha256sums.txt)

      - name: Upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: apps/daemon/dist/*

  relay-image:
    name: Build & push relay image (ghcr.io/riffpad/relay)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # The relay Dockerfile embeds packages/webui/dist via go:embed, so the
      # client must be built before the image is assembled (same as the daemon
      # binaries above).
      - name: Build web client (embedded into relay image)
        run: pnpm --filter client-beta build

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        # tag v0.2.5 -> 0.2.5; workflow_dispatch on a branch -> dev-<sha>
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/riffpad/relay:latest
            ghcr.io/riffpad/relay:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
